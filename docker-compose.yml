services:
  backend:
    build:
      context: ./backend
    container_name: node-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules   # ← これが必須
    command: npm run dev
    environment:
      - NODE_ENV=development
      
  frontend:
    build:
      context: ./frontend
    container_name: react-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app              
      - /app/node_modules            
    command: npm run dev
    environment:
      - NODE_ENV=development